<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AVA-Educa+</title>

        <!-- Importação de fontes -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
            rel="stylesheet"
        />

        <!-- Estilos -->
        <link rel="stylesheet" href="../css/style.css" />
        <link rel="stylesheet" href="./dashboard.css" />
    </head>
    <body>
        <!-- Cabeçalho inserido dinâmicamente TBD -->
        <header></header>

        <div class="container">
            <!-- Barra lateral inserida dinâmicamente TBD -->
            <aside class="shadow-default">
                <ul>
                    <li>1</li>
                    <li>2</li>
                    <li>3</li>
                    <li>4</li>
                    <li>5</li>
                </ul>
            </aside>

            <main class="shadow-default">
                <section id="card-container"></section>
            </main>
        </div>

        <!-- Scripts para incluir os ícones Lucide -->
        <script src="https://unpkg.com/lucide@1.14.0/dist/umd/lucide.js"></script>
        <!-- O createIcons vai ser executado no script de criar os cards 
         já que eles são criados após o carregamento inicial da página -->

        <!-- Moment para formatar as datas igual ao AVA -->
        <!-- Vai ser usado em dashboard.js -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment.min.js"
            integrity="sha512-iJIt5wigccZYA4F3G8kWt8H0r43JDWpvBweaGct6QsveuU4zmyP6VX2EXMfSfA/Z80b1PfHUNLioFfY1Z55cCg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>

        <!-- Script para fazer os cards -->
        <script src="./dashboard.js" type="module"></script>
    </body>
</html>
