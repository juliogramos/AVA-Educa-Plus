<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AVA-Educa+</title>

        <!-- Importação de fontes -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
            rel="stylesheet"
        />

        <!-- Estilos -->
        <link rel="stylesheet" href="../css/style.css" />
        <link rel="stylesheet" href="./cadastro-aluno.css" />

        <!-- Scripts para incluir os ícones Lucide -->
        <!-- O createIcons vai ser chamado em diferentes scripts -->
        <script src="https://unpkg.com/lucide@1.14.0/dist/umd/lucide.js"></script>

        <!-- Inserir menu lateral e cabeçalho dinâmicamente -->
        <!-- PRECISA estar abaixo da declaração do Lucide! -->
        <script src="../js/cabecalho.js" defer></script>
        <script src="../js/menu-lateral.js" defer></script>

        <!-- Moment para validar as datas -->
        <!-- Vai ser usado em cadastro-aluno.js incluído no fim do body -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment.min.js"
            integrity="sha512-iJIt5wigccZYA4F3G8kWt8H0r43JDWpvBweaGct6QsveuU4zmyP6VX2EXMfSfA/Z80b1PfHUNLioFfY1Z55cCg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
    </head>
    <body>
        <!-- Cabeçalho inserido dinâmicamente aqui -->

        <div class="container">
            <!-- Barra lateral inserida dinâmicamente aqui -->

            <main class="shadow-default">
                <h1>Cadastro de Alunos</h1>
                <form>
                    <label for="nome">Nome Completo: </label>
                    <input
                        type="text"
                        name="nome"
                        id="nome"
                        required
                        min="4"
                        max="80"
                    />

                    <label for="genero">Gênero: </label>
                    <select name="genero" id="genero" required>
                        <option value="masculino">Masculino</option>
                        <option value="feminino">Feminino</option>
                        <option value="outro">Outro</option>
                    </select>

                    <label for="data">Data de Nascimento: </label>
                    <input type="date" name="data" id="data" required />

                    <label for="cpf">CPF: </label>
                    <input type="number" name="cpf" id="cpf" required />

                    <label for="telefone">Telefone: </label>
                    <input type="tel" name="telefone" id="telefone" required />

                    <label for="email">Email: </label>
                    <input type="email" name="email" id="email" required />

                    <label for="cep">CEP: </label>
                    <input type="number" name="cep" id="cep" required />

                    <fieldset>
                        <legend>Endereço</legend>

                        <label for="cidade">Cidade: </label>
                        <input type="text" name="cidade" id="cidade" required />

                        <label for="estado">Estado: </label>
                        <input type="text" name="estado" id="estado" required />

                        <label for="logradouro">Logradouro: </label>
                        <input
                            type="text"
                            name="logradouro"
                            id="logradouro"
                            required
                        />

                        <label for="numero">Número: </label>
                        <input
                            type="number"
                            name="numero"
                            id="numero"
                            required
                        />

                        <label for="complemento">Complemento: </label>
                        <input
                            type="text"
                            name="complemento"
                            id="complemento"
                        />

                        <label for="bairro">Bairro: </label>
                        <input type="text" name="bairro" id="bairro" required />
                    </fieldset>
                    <button type="submit">Salvar</button>
                </form>
            </main>
        </div>
    </body>
</html>
